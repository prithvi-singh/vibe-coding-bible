const systemColors = {
  Zoho: { bg: "#1a1a2e", border: "#e94560", text: "#e94560", label: "ZOHO" },
  Unity: { bg: "#1a1a2e", border: "#0f3460", text: "#53a8e2", label: "UNITY" },
  "Zoho → Unity": { bg: "#1a1a2e", border: "#f5a623", text: "#f5a623", label: "ZOHO → UNITY" },
  "Unity + Zoho": { bg: "#1a1a2e", border: "#f5a623", text: "#f5a623", label: "UNITY + ZOHO" },
  Manual: { bg: "#1a1a2e", border: "#7c7c7c", text: "#a0a0a0", label: "MANUAL" },
  Gap: { bg: "#1a1a2e", border: "#ff6b6b", text: "#ff6b6b", label: "GAP" },
  "Manual + Zoho": { bg: "#1a1a2e", border: "#e94560", text: "#e94560", label: "MANUAL + ZOHO" },
  "Zoho + Manual": { bg: "#1a1a2e", border: "#e94560", text: "#e94560", label: "ZOHO + MANUAL" },
};

const statusConfig = {
  active: { color: "#4ade80", label: "Working" },
  partial: { color: "#f5a623", label: "Partial" },
  broken: { color: "#ff4444", label: "Broken" },
  missing: { color: "#ff6b6b", label: "Missing" },
};

const emotionGradient = [
  "#e94560", "#f5a623", "#f5a623", "#53a8e2", "#7c5cbf",
  "#4ade80", "#f5a623", "#f5a623", "#4ade80",
];

function CustomerJourneyMap() {
  const [selectedStage, setSelectedStage] = useState(0);
  const [showView, setShowView] = useState("current");

  const stage = journeyData[selectedStage];

  const totalGaps = journeyData.reduce(
    (acc, s) => acc + s.touchpoints.filter((t) => t.gap).length, 0
  );
  const totalTouchpoints = journeyData.reduce(
    (acc, s) => acc + s.touchpoints.length, 0
  );
  const criticalGaps = journeyData.reduce(
    (acc, s) => acc + s.touchpoints.filter((t) => t.status === "broken" || t.status === "missing").length, 0
  );

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', 'Segoe UI', sans-serif", background: "#0d0d1a", color: "#e8e8f0", minHeight: "100vh", padding: "0" }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)", padding: "32px 40px", borderBottom: "1px solid #2a2a4a" }}>
        <div style={{ fontSize: "11px", letterSpacing: "3px", color: "#e94560", textTransform: "uppercase", marginBottom: "8px", fontWeight: 600 }}>
          Customer Journey Map
        </div>
        <h1 style={{ fontSize: "28px", fontWeight: 700, margin: "0 0 8px 0", color: "#ffffff" }}>
          Child Developmental Therapy — Parent Experience
        </h1>
        <p style={{ fontSize: "14px", color: "#8888a8", margin: 0, maxWidth: "600px" }}>
          Touchpoint mapping across Zoho (admin/billing) and Unity (clinical) — identifying gaps, breaks, and the path to the ideal state.
        </p>

        <div style={{ display: "flex", gap: "32px", marginTop: "24px", flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: "28px", fontWeight: 700, color: "#fff" }}>{journeyData.length}</div>
            <div style={{ fontSize: "11px", color: "#8888a8", letterSpacing: "1px" }}>STAGES</div>
          </div>
          <div>
            <div style={{ fontSize: "28px", fontWeight: 700, color: "#fff" }}>{totalTouchpoints}</div>
            <div style={{ fontSize: "11px", color: "#8888a8", letterSpacing: "1px" }}>TOUCHPOINTS</div>
          </div>
          <div>
            <div style={{ fontSize: "28px", fontWeight: 700, color: "#f5a623" }}>{totalGaps}</div>
            <div style={{ fontSize: "11px", color: "#8888a8", letterSpacing: "1px" }}>GAPS IDENTIFIED</div>
          </div>
          <div>
            <div style={{ fontSize: "28px", fontWeight: 700, color: "#ff4444" }}>{criticalGaps}</div>
            <div style={{ fontSize: "11px", color: "#8888a8", letterSpacing: "1px" }}>CRITICAL / MISSING</div>
          </div>
        </div>
      </div>

      {/* Journey Timeline */}
      <div style={{ padding: "24px 40px 0", overflowX: "auto" }}>
        <div style={{ display: "flex", gap: "4px", minWidth: "fit-content", position: "relative" }}>
          {journeyData.map((s, i) => {
            const isActive = i === selectedStage;
            const gapCount = s.touchpoints.filter((t) => t.gap).length;
            return (
              <button
                key={s.id}
                onClick={() => setSelectedStage(i)}
                style={{
                  flex: "1 0 auto", minWidth: "120px", padding: "16px 14px 14px",
                  background: isActive ? "linear-gradient(180deg, #1e1e3a 0%, #16213e 100%)" : "transparent",
                  border: "none",
                  borderTop: `3px solid ${isActive ? emotionGradient[i] : "#2a2a4a"}`,
                  borderBottom: isActive ? "none" : "1px solid #2a2a4a",
                  borderRadius: "8px 8px 0 0", cursor: "pointer", textAlign: "left",
                  transition: "all 0.2s", position: "relative",
                }}
              >
                <div style={{ fontSize: "10px", color: isActive ? emotionGradient[i] : "#666", letterSpacing: "1px", marginBottom: "4px", fontWeight: 600 }}>
                  STAGE {i + 1}
                </div>
                <div style={{ fontSize: "13px", fontWeight: isActive ? 700 : 500, color: isActive ? "#fff" : "#888", lineHeight: 1.3 }}>
                  {s.stage}
                </div>
                {gapCount > 0 && (
                  <div style={{
                    position: "absolute", top: "10px", right: "10px",
                    background: gapCount >= 3 ? "#ff4444" : "#f5a623",
                    color: "#fff", fontSize: "10px", fontWeight: 700, borderRadius: "50%",
                    width: "18px", height: "18px", display: "flex", alignItems: "center", justifyContent: "center",
                  }}>
                    {gapCount}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>

      {/* Stage Detail */}
      <div style={{ padding: "0 40px 40px", background: "linear-gradient(180deg, #16213e 0%, #0d0d1a 100%)" }}>
        <div style={{
          padding: "28px 0 20px", borderBottom: "1px solid #2a2a4a", marginBottom: "24px",
          display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: "16px",
        }}>
          <div>
            <h2 style={{ fontSize: "22px", fontWeight: 700, margin: "0 0 8px 0", color: "#fff" }}>{stage.stage}</h2>
            <div style={{ fontSize: "13px", color: emotionGradient[selectedStage], fontStyle: "italic" }}>
              Parent emotional state: {stage.parentEmotion}
            </div>
          </div>
          <div style={{ display: "flex", gap: "6px" }}>
            {["current", "ideal", "gaps"].map((v) => (
              <button
                key={v}
                onClick={() => setShowView(v)}
                style={{
                  padding: "8px 16px", fontSize: "12px", fontWeight: 600, letterSpacing: "0.5px",
                  border: showView === v ? "1px solid #e94560" : "1px solid #3a3a5a",
                  background: showView === v ? "#e9456020" : "transparent",
                  color: showView === v ? "#e94560" : "#8888a8",
                  borderRadius: "6px", cursor: "pointer", textTransform: "uppercase", transition: "all 0.2s",
                }}
              >
                {v === "current" ? "Current State" : v === "ideal" ? "Ideal State" : "Gaps Only"}
              </button>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
          {stage.touchpoints
            .filter((t) => (showView === "gaps" ? t.gap : true))
            .map((tp, i) => {
              const sys = systemColors[tp.system] || systemColors["Manual"];
              const stat = statusConfig[tp.status];
              return (
                <div key={i} style={{
                  background: "#1a1a2e", borderRadius: "10px",
                  border: `1px solid ${tp.gap ? "#3a2a2a" : "#2a2a4a"}`,
                  borderLeft: `4px solid ${sys.border}`, padding: "20px 24px", transition: "all 0.2s",
                }}>
                  <div style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                    marginBottom: "12px", flexWrap: "wrap", gap: "8px",
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "12px", flexWrap: "wrap" }}>
                      <span style={{ fontSize: "15px", fontWeight: 600, color: "#fff" }}>{tp.name}</span>
                      <span style={{
                        fontSize: "10px", fontWeight: 700, letterSpacing: "1.5px", color: sys.text,
                        background: `${sys.border}15`, padding: "3px 10px", borderRadius: "4px",
                        border: `1px solid ${sys.border}40`,
                      }}>
                        {sys.label}
                      </span>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                      <div style={{ width: "8px", height: "8px", borderRadius: "50%", background: stat.color }} />
                      <span style={{ fontSize: "11px", color: stat.color, fontWeight: 600, letterSpacing: "0.5px" }}>
                        {stat.label}
                      </span>
                    </div>
                  </div>

                  {(showView === "current" || showView === "gaps") && (
                    <div style={{
                      fontSize: "13px", lineHeight: 1.6, color: "#a0a0b8",
                      marginBottom: "12px", padding: "10px 14px", background: "#12121f",
                      borderRadius: "6px", borderLeft: "3px solid #3a3a5a",
                    }}>
                      <span style={{ fontSize: "10px", color: "#666", letterSpacing: "1px", display: "block", marginBottom: "4px", fontWeight: 600 }}>
                        TODAY
                      </span>
                      {tp.current}
                    </div>
                  )}

                  {(showView === "ideal" || showView === "gaps") && (
                    <div style={{
                      fontSize: "13px", lineHeight: 1.6, color: "#c8c8e0",
                      padding: "10px 14px", background: "#0f1f0f", borderRadius: "6px",
                      borderLeft: "3px solid #4ade80",
                    }}>
                      <span style={{ fontSize: "10px", color: "#4ade80", letterSpacing: "1px", display: "block", marginBottom: "4px", fontWeight: 600 }}>
                        IDEAL STATE
                      </span>
                      {tp.ideal}
                    </div>
                  )}
                </div>
              );
            })}
        </div>

        {showView === "gaps" && stage.touchpoints.filter((t) => t.gap).length === 0 && (
          <div style={{ textAlign: "center", padding: "40px", color: "#4ade80", fontSize: "14px" }}>
            ✓ No gaps identified in this stage
          </div>
        )}
      </div>

      {/* System Legend */}
      <div style={{ padding: "24px 40px", borderTop: "1px solid #2a2a4a", display: "flex", gap: "20px", flexWrap: "wrap", alignItems: "center" }}>
        <span style={{ fontSize: "10px", color: "#666", letterSpacing: "1.5px", fontWeight: 600 }}>SYSTEMS:</span>
        {Object.entries(systemColors)
          .filter(([k]) => ["Zoho", "Unity", "Manual", "Gap"].includes(k))
          .map(([key, val]) => (
            <div key={key} style={{ display: "flex", alignItems: "center", gap: "6px" }}>
              <div style={{ width: "12px", height: "3px", background: val.border, borderRadius: "2px" }} />
              <span style={{ fontSize: "11px", color: val.text }}>{val.label}</span>
            </div>
          ))}
        <span style={{ fontSize: "10px", color: "#666", letterSpacing: "1.5px", fontWeight: 600, marginLeft: "12px" }}>STATUS:</span>
        {Object.entries(statusConfig).map(([key, val]) => (
          <div key={key} style={{ display: "flex", alignItems: "center", gap: "6px" }}>
            <div style={{ width: "8px", height: "8px", borderRadius: "50%", background: val.color }} />
            <span style={{ fontSize: "11px", color: val.color }}>{val.label}</span>
          </div>
        ))}
      </div>

      <div style={{ padding: "16px 40px 32px", fontSize: "12px", color: "#555", lineHeight: 1.6 }}>
        North Star: "Give parents back their life." Every touchpoint should reduce parent stress and increase their sense of control and hope.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CustomerJourneyMap />);
</script>
</body>
</html>
